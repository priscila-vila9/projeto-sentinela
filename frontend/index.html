<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sistema Hospitalar - Login</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="login-container">

    <img
      src="logo.png"
      alt="Logo do Hospital"
      class="logo"
    >

    <h2>🏥 Sistema Hospitalar</h2>

    <form class="login-form" onsubmit="login(); return false;">

      <input
        id="usuario"
        type="text"
        placeholder="Usuário"
        autocomplete="username"
        required
      >

      <input
        id="senha"
        type="password"
        placeholder="Senha"
        autocomplete="current-password"
        required
      >

      <button type="submit">
        Entrar
      </button>

    </form>

  </main>

</body>


</html>
