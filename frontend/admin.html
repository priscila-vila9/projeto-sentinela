<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Cadastro Simples</title>
</head>
<body>
    <div class="container">
    <a href="index.html" style="text-decoration: none;
    color: #3498db; margin-bottom: 12px;
    font-size:14px; display: inline-block;">Voltar para a Login</a>
    <h2>Cadastrar Usuários</h2>
<form id="FormUsuario">
    <input type="text" id="usuario" placeholder="Nome de Usuario(Login)" required>
    <input type="password" id="senha" placeholder="Senha" required>

<select id="tipo" required>
        <option value="">Selecione o Setor</option>
        <option value="atendimento">Atendimento</option>
        <option value="triagem">Triagem</option>
        <option value="medico">Médico</option>
    </select>

    <button type="submit">Cadastrar Usuario</button>
</form>

<hr style="margin: 25px 0; border: none; border-top: 1px solid #ccc;">

<h3> Usuários Cadastrados</h3>
<div id="listaUsuarios"></div>
    </div>

    <script>
// 1. Cadastrar usuario ao enviar o formulário
document.getElementById('FormUsuario').addEventListener('submit',
 function(event) {
    event.preventDefault();

    const usuario = document.getElementById('usuario').value;
    const senha = document.getElementById('senha').value;
    const tipo = document.getElementById('tipo').value;

    fetch("/usuarios", {
        method: "POST",
        headers: {"Content-Type": "application/json" },
        body: JSON.stringify({ usuario, senha, tipo })
    })
    .then(res=> res.json())
    .then(dados => {
       if(dados.erro) {
        alert("erro: " + dados.erro);
       } else {
        alert("Usuário cadastrado com sucesso!");
        document.getElementById('FormUsuario').reset();
        CarregarUsuarios();
       }
       
    });

});
//carregar e listar os usuarios cadastrados
function CarregarUsuarios() {
    fetch("/usuarios")
    .then(res => res.json())
    .then(usuarios => {
        const lista = document.getElementById('listaUsuarios');
        lista.innerHTML = '';
        usuarios.forEach(u => {
            const div = document.createElement('div');
            div.textContent = `Usuário: ${u.usuario}, Tipo: ${u.tipo}`;
            lista.appendChild(div);
        });
    });
} 
// Chama a função para carregar os usuários ao abrir a página
    carregarUsuarios(); 
    </script>
 
    
</body>
</html>
