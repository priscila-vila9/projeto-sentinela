<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triagem</title>
<link rel="stylesheet" href="style.css">

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 30px 15px;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #fff0f5, #fce4ec, #f8bbd0);
    color: #4a2635;
  }

  .container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 30px;
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(194, 24, 91, 0.12);
    border: 1px solid #f8d7e3;
  }

  h2 {
    color: #ad1457;
    font-size: 27px;
  }

  h3 {
    color: #c2185b;
  }

  hr {
    border: none;
    border-top: 1px solid #f3c5d6;
    margin: 28px 0;
  }

  /* Botão para abrir a TV */
  .btn-abrir-tv {
    display: inline-block;
    background: #d81b60;
    color: white;
    padding: 11px 16px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    border: none;
    transition: 0.25s;
  }

  .btn-abrir-tv:hover {
    background: #ad1457;
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(216, 27, 96, 0.2);
  }

  /* Painel da fila de pacientes */
  .pacientes-fila {
    margin-bottom: 30px;
    background: #fff5f8;
    border-radius: 14px;
    padding: 20px;
    border: 1px solid #f3c5d6;
  }

  .pacientes-fila h3 {
    margin-top: 0;
    color: #ad1457;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .pacientes-fila h3 span {
    font-size: 12px;
    font-weight: normal;
    color: #996477;
  }

  /* Cada paciente da fila */
  .fila-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    background: #ffffff;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    border: 1px solid #f1c4d5;
    box-shadow: 0 2px 6px rgba(173, 20, 87, 0.05);
    transition: 0.2s;
  }

  .fila-item:hover {
    border-color: #e5739d;
    box-shadow: 0 4px 12px rgba(173, 20, 87, 0.1);
  }

  .fila-item strong {
    font-size: 15px;
    color: #6a1b3d;
    overflow-wrap: anywhere;
  }

  .fila-item small {
    display: inline-block;
    margin-top: 5px;
    color: #997080;
    font-size: 12px;
  }

  /* Botão chamar paciente na TV */
  .btn-tv {
    background: #ec407a;
    color: white;
    border: none;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    transition: 0.25s;
  }

  .btn-tv:hover {
    background: #c2185b;
    transform: translateY(-1px);
  }

  /* Formulário */
  #nome,
  #sintoma,
  #temp,
  #alergia,
  #observacao {
    display: block;
    width: 100%;
    margin: 12px 0;
    padding: 13px 15px;
    border: 1px solid #e8b7c9;
    border-radius: 9px;
    background: #fffafd;
    color: #4a2635;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  #nome:focus,
  #sintoma:focus,
  #temp:focus,
  #alergia:focus,
  #observacao:focus {
    border-color: #ec407a;
    box-shadow: 0 0 0 3px rgba(236, 64, 122, 0.12);
    background: #ffffff;
  }

  #sintoma {
    cursor: pointer;
  }

  #observacao {
    min-height: 110px;
    resize: vertical;
  }

  input::placeholder,
  textarea::placeholder {
    color: #b18a9a;
  }

  /* Botão atualizar lista */
  .pacientes-fila > button {
    background: #ad1457 !important;
    padding: 9px 14px !important;
    border-radius: 7px !important;
    transition: 0.2s;
  }

  .pacientes-fila > button:hover {
    background: #880e4f !important;
  }

  /* Botão salvar triagem */
  .container > button {
    width: 100%;
    margin-top: 12px;
    padding: 14px;
    background: linear-gradient(135deg, #ec407a, #c2185b);
    color: #ffffff;
    border: none;
    border-radius: 9px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(194, 24, 91, 0.15);
    transition: 0.25s;
  }

  .container > button:hover {
    background: linear-gradient(135deg, #d81b60, #ad1457);
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(194, 24, 91, 0.22);
  }

  /* Resultado da classificação de risco */
  #resultado {
    margin-top: 18px;
    padding: 14px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
  }

  #resultado:empty {
    display: none;
  }

  #resultado.verde {
    background: #e8f5e9;
    color: #2e7d32;
    border: 1px solid #a5d6a7;
  }

  #resultado.amarelo {
    background: #fff8e1;
    color: #9a6700;
    border: 1px solid #ffe082;
  }

  #resultado.vermelho {
    background: #ffebee;
    color: #c62828;
    border: 1px solid #ef9a9a;
  }

  /* Adaptação para celulares */
  @media (max-width: 600px) {
    body {
      padding: 15px 10px;
    }

    .container {
      padding: 18px;
      border-radius: 13px;
    }

    h2 {
      font-size: 21px;
    }

    .fila-item {
      align-items: flex-start;
      flex-direction: column;
    }

    .btn-tv {
      width: 100%;
    }

    .pacientes-fila h3 {
      align-items: flex-start;
      flex-direction: column;
    }

    .btn-abrir-tv {
      padding: 9px 10px;
      font-size: 12px;
    }
  }
</style>
</head>

<body>
<div class="container">

  <!-- Cabeçalho com botão da TV -->
  <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:20px;">
    <h2 style="margin:0;">🏥 Triagem Hospitalar</h2>
    <button class="btn-abrir-tv" onclick="window.open('tv.html','_blank')">📺 Abrir Tela da TV</button>
  </div>

  <!-- Fila de pacientes do Atendimento -->
  <div class="pacientes-fila">
    <h3>
      Pacientes Cadastrados no Atendimento
      <span>Clique em "Chamar na TV" para chamar ao guichê</span>
    </h3>

    <div id="fila-pacientes">
      <p style="color:#b18a9a; text-align:center;">Carregando...</p>
    </div>

    <button onclick="carregarPacientes()" style="margin-top:8px; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:13px;">🔄 Atualizar lista</button>
  </div>

  <hr>

  <h3>🩺 Formulário de Triagem</h3>

  <input id="nome" placeholder="Nome do paciente">

  <select id="sintoma">
    <option value="">Selecione o sintoma</option>
    <option value="dor_leve">Dor leve</option>
    <option value="resfriado">Resfriado</option>
    <option value="coriza">Coriza</option>
    <option value="tosse">Tosse</option>
    <option value="febre">Febre</option>
    <option value="vomito">Vômito</option>
    <option value="diarreia">Diarreia</option>
    <option value="falta_ar_moderada">Falta de ar moderada</option>
    <option value="falta_ar_grave">Falta de ar grave</option>
    <option value="infarto">Suspeita de infarto</option>
    <option value="avc">Suspeita de AVC</option>
    <option value="convulsao">Convulsão</option>
    <option value="hemorragia">Hemorragia</option>
  </select>

  <input id="temp" type="number" placeholder="Temperatura" step="0.1">
  <input id="alergia" placeholder="Alergias">
  <textarea id="observacao" placeholder="Observações"></textarea>

  <div id="resultado"></div>

  <button onclick="salvar()">💗 Salvar Triagem</button>

</div>

<script>

function carregarPacientes() {
  fetch("/pacientes")
    .then(r => r.json())
    .then(pacientes => {
      const div = document.getElementById("fila-pacientes");

      // Mostra apenas os com status "triagem"
      const fila = pacientes.filter(p => p.status === "triagem");

      if (fila.length === 0) {
        div.innerHTML = "<p style='color:#b18a9a; text-align:center;'>Nenhum paciente aguardando.</p>";
        return;
      }

      div.innerHTML = "";
      fila.forEach(p => {
        const item = document.createElement("div");
        item.className = "fila-item";
        item.innerHTML = `
          <div>
            <strong>${p.nome}</strong><br>
            <small>CPF: ${p.cpf || "—"} | Tipo: ${p.tipo || "—"}</small>
          </div>
          <button class="btn-tv" onclick="chamarNaTV('${p.nome}')">📺 Chamar na TV</button>
        `;
        div.appendChild(item);
      });
    })
    .catch(() => {
      document.getElementById("fila-pacientes").innerHTML =
        "<p style='color:#c62828;'>Erro ao carregar pacientes.</p>";
    });
}

// Envia o nome do paciente para a TV
function chamarNaTV(nome) {
  fetch("/tv/chamar", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      localTipo: "GUICHÊ",
      localNumero: "01",
      paciente: nome
    })
  })
  .then(r => r.json())
  .then(() => {
    alert("✅ " + nome + " foi chamado na TV para o Guichê 01!");
  });
}

function classificarRisco(sintoma, temperatura) {
  const vermelhos = ["infarto","avc","convulsao","hemorragia","falta_ar_grave"];
  const amarelos = ["febre","vomito","diarreia","falta_ar_moderada"];
  if (temperatura >= 39) return "vermelho";
  if (vermelhos.includes(sintoma)) return "vermelho";
  if (amarelos.includes(sintoma)) return "amarelo";
  return "verde";
}

function salvar() {
  const nome = document.getElementById("nome").value;
  const sintoma = document.getElementById("sintoma").value;
  const temperatura = Number(document.getElementById("temp").value);
  const alergia = document.getElementById("alergia").value;
  const observacao = document.getElementById("observacao").value;
  const risco = classificarRisco(sintoma, temperatura);

  fetch("/triagem", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ nome, sintoma, temperatura, alergia, observacao, risco })
  })
  .then(r => r.json())
  .then(data => {
    const resultado = document.getElementById("resultado");
    resultado.className = risco;
    resultado.innerHTML = "Classificação: " + risco.toUpperCase();
    alert("Triagem salva com sucesso!");
  });
}

// Carrega a fila ao abrir a página
carregarPacientes();

// Atualiza a lista automaticamente a cada 10 segundos
setInterval(carregarPacientes, 10000);

</script>

</body>
</html>
