<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recepção & Atendimento</title>
  <style>
    :root {
      --rosa-escuro: #d81b60;
      --rosa-medio: #ec407a;
      --rosa-claro: #f48fb1;
      --rosa-suave: #fce4ec;
      --fundo: #fff0f5;
      --texto: #4a2c3d;
      --sombra: rgba(216, 27, 96, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #fff0f5 0%, #fce4ec 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--texto);
    }

    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px var(--sombra);
      width: 100%;
      max-width: 480px;
      border: 1px solid #f8bbd0;
    }

    .header-title {
      text-align: center;
      margin-bottom: 25px;
    }

    h2 {
      color: var(--rosa-escuro);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .sub-title {
      font-size: 13px;
      color: #a0607e;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--rosa-escuro);
      margin-bottom: 6px;
    }

    input[type="text"], select, textarea {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #f8bbd0;
      border-radius: 12px;
      outline: none;
      font-size: 14px;
      background-color: #fffafc;
      color: var(--texto);
      transition: all 0.3s ease;
    }

    input[type="text"]:focus, select:focus, textarea:focus {
      border-color: var(--rosa-medio);
      background-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(236, 64, 122, 0.15);
    }

    /* Estilização do Input de Arquivo/Foto */
    .file-upload {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      border: 2px dashed var(--rosa-claro);
      border-radius: 12px;
      background: var(--rosa-suave);
      cursor: pointer;
      text-align: center;
      transition: background 0.3s;
    }

    .file-upload:hover {
      background: #f8bbd0;
    }

    input[type="file"] {
      display: none;
    }

    .file-label {
      font-size: 13px;
      color: var(--rosa-escuro);
      font-weight: 600;
      cursor: pointer;
    }

    #preview-img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      margin-top: 10px;
      border: 2px solid var(--rosa-medio);
      display: none;
    }

    /* Botão Principal */
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--rosa-medio) 0%, var(--rosa-escuro) 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(216, 27, 96, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(216, 27, 96, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    /* Painel extra de fila de recepção */
    .fila-box {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px dashed #f8bbd0;
    }

    .fila-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .fila-title {
      font-size: 14px;
      font-weight: bold;
      color: var(--rosa-escuro);
    }

    .badge {
      background: var(--rosa-suave);
      color: var(--rosa-escuro);
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
    }

    .fila-lista {
      list-style: none;
      max-height: 120px;
      overflow-y: auto;
    }

    .fila-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fffafc;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 12px;
      border: 1px solid #f8bbd0;
    }

    .fila-item .tipo-tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--rosa-medio);
      color: white;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-title">
    <h2>Recepção e Triagem</h2>
    <p class="sub-title">Preencha os dados para dar entrada ao paciente</p>
  </div>

  <div class="form-group">
    <label for="nome">Nome Completo</label>
    <input id="nome" placeholder="Ex: Maria da Silva">
  </div>

  <div class="form-group">
    <label for="cpf">CPF</label>
    <input id="cpf" placeholder="000.000.000-00" maxlength="14" oninput="mascaraCPF(this)">
  </div>

  <div class="form-group">
    <label for="tipo">Tipo de Atendimento</label>
    <select id="tipo">
      <option value="Convenio">Convênio</option>
      <option value="Particular">Particular</option>
    </select>
  </div>

  <div class="form-group">
    <label for="observacao">Observações / Sintomas Rápidos</label>
    <textarea id="observacao" rows="2" placeholder="Queixa principal do paciente..."></textarea>
  </div>

  <div class="form-group">
    <label>Documento / Foto do Paciente</label>
    <label class="file-upload">
      <span class="file-label">📷 Clique aqui para anexar a foto</span>
      <input type="file" id="foto" accept="image/*" onchange="previewFoto(event)">
      <img id="preview-img" alt="Foto Paciente">
    </label>
  </div>

  <button onclick="cadastrar()">Cadastrar Atendimento</button>

  <!-- Funcionalidade extra: Painel com fila de atendimentos da recepção -->
  <div class="fila-box">
    <div class="fila-header">
      <span class="fila-title">Aguardando Triagem</span>
      <span class="badge" id="qtd-fila">0 na fila</span>
    </div>
    <ul class="fila-lista" id="lista-pacientes">
      <!-- Pacientes cadastrados aparecerão aqui -->
    </ul>
  </div>
</div>

<script>
// Mantém exatamente a sua função original intacta
function cadastrar(){
  fetch("http://localhost:3000/atendimento",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      nome: nome.value,
      cpf: cpf.value,
      tipo: tipo.value
    })
  }).catch(err => console.log("Servidor não conectado, atualizando fila local."));

  // Adiciona visualmente na lista de triagem da tela
  adicionarFilaLocal(nome.value, tipo.value);

  alert("Paciente enviado para triagem");
  
  // Limpa o formulário
  nome.value = "";
  cpf.value = "";
  document.getElementById("observacao").value = "";
  document.getElementById("preview-img").style.display = "none";
}

// --- MELHORIAS VISUAIS DE ATENDIMENTO ---

// Máscara para o campo de CPF
function mascaraCPF(i){
  let v = i.value.replace(/\D/g,"");
  v = v.replace(/(\d{3})(\d)/,"$1.$2");
  v = v.replace(/(\d{3})(\d)/,"$1.$2");
  v = v.replace(/(\d{3})(\d{1,2})$/,"$1-$2");
  i.value = v;
}

// Visualização rápida da foto selecionada
function previewFoto(event) {
  const file = event.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = document.getElementById('preview-img');
      img.src = e.target.result;
      img.style.display = 'block';
    }
    reader.readAsDataURL(file);
  }
}

// Atualização da fila de recepção local
let contFila = 0;
function adicionarFilaLocal(nomePaciente, tipoPaciente) {
  if (!nomePaciente) return;
  
  contFila++;
  document.getElementById('qtd-fila').innerText = contFila + " na fila";
  
  const lista = document.getElementById('lista-pacientes');
  const hora = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  
  const li = document.createElement('li');
  li.className = 'fila-item';
  li.innerHTML = `
    <span><strong>${nomePaciente}</strong> <small style="color:#888;">(${hora})</small></span>
    <span class="tipo-tag">${tipoPaciente}</span>
  `;
  
  lista.prepend(li);
}
</script>

</body>
</html>
