<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sistema Hospitalar - Login</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Página de Login -->
  <div class="login-page">

    <!-- Cartão principal -->
    <div class="login-container">

      <!-- Cabeçalho -->
      <div class="login-header">

        <div class="logo-container">
          <img
            src="logo.png"
            alt="Logo do Hospital"
            class="logo"
          >
        </div>

        <div class="title-container">
          <h1>Sistema Hospitalar</h1>
          <p>Acesso ao sistema</p>
        </div>

      </div>

      <!-- Área do Login -->
      <div class="login-body">

        <form class="login-form" onsubmit="login(); return false;">

          <!-- Usuário -->
          <div class="login-field">

            <label for="usuario">
              Usuário
            </label>

            <input
              id="usuario"
              type="text"
              placeholder="Digite seu usuário"
              autocomplete="username"
              required
            >

          </div>

          <!-- Senha -->
          <div class="login-field">

            <label for="senha">
              Senha
            </label>

            <input
              id="senha"
              type="password"
              placeholder="Digite sua senha"
              autocomplete="current-password"
              required
            >

          </div>

          <!-- Botão -->
          <div class="login-button-container">

            <button type="submit">
              Entrar
            </button>

          </div>

        </form>

      </div>

      <!-- Rodapé -->
      <div class="login-footer">
        <p>Acesso restrito aos profissionais autorizados</p>
      </div>

    </div>

  </div>


  <script>

    function login() {

      const usuarioInput =
        document.getElementById("usuario").value;

      const senhaInput =
        document.getElementById("senha").value;

      fetch("/login", {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          usuario: usuarioInput,
          senha: senhaInput
        })
      })

      .then(r => r.json())

      .then(data => {

        if (data.tipo === "triagem") {
          location.href = "triagem.html";
        }

        if (data.tipo === "medico") {
          location.href = "medico.html";
        }

        if (data.tipo === "atendimento") {
          location.href = "atendimento.html";
        }

      })

      .catch(err => {
        console.error("Erro na requisição:", err);
      });

    }

  </script>

</body>

</html>
