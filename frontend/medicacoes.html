```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medicações Prescritas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">
    <h2>💊 Medicações Prescritas</h2>
    <div id="listaMedicacoes" aria-live="polite">
      <p>Carregando medicações...</p>
    </div>
  </div>

  <script>
    async function carregarMedicacoesPrescritas() {
      const div = document.getElementById("listaMedicacoes");

      try {
        const resposta = await fetch("/medicacoes");

        if (!resposta.ok) {
          throw new Error("Não foi possível carregar as medicações.");
        }

        const data = await resposta.json();

        if (!Array.isArray(data)) {
          throw new Error("Os dados recebidos estão em formato inválido.");
        }

        div.innerHTML = "";

        const medicacoes = data.filter(c =>
          c.medicacao &&
          c.medicacao.trim() !== ""
        );

        if (medicacoes.length === 0) {
          div.textContent = "Nenhuma medicação prescrita.";
          return;
        }

        medicacoes.forEach(c => {
          const card = document.createElement("div");
          card.className = "card";

          const paciente = document.createElement("h3");
          paciente.textContent = c.paciente || "Paciente não informado";

          const medicacao = document.createElement("p");
          medicacao.innerHTML = "<b>Medicação:</b> ";
          medicacao.appendChild(
            document.createTextNode(c.medicacao)
          );

          const diagnostico = document.createElement("p");
          diagnostico.innerHTML = "<b>Diagnóstico:</b> ";
          diagnostico.appendChild(
            document.createTextNode(c.diagnostico || "Não informado")
          );

          const observacoes = document.createElement("p");
          observacoes.innerHTML = "<b>Observações:</b> ";
          observacoes.appendChild(
            document.createTextNode(c.obs || "Nenhuma")
          );

          card.appendChild(paciente);
          card.appendChild(medicacao);
          card.appendChild(diagnostico);
          card.appendChild(observacoes);

          div.appendChild(card);
        });

      } catch (erro) {
        console.error("Erro ao carregar medicações:", erro);
        div.textContent =
          "Erro ao carregar as medicações. Verifique o servidor.";
      }
    }

    carregarMedicacoesPrescritas();
  </script>

</body>
</html>
```
